# Configuração do SonarQube para análise do OWASP Juice Shop

# Identificação do projeto
sonar.projectKey=juice-shop
sonar.projectName=OWASP Juice Shop
sonar.projectVersion=1.0

# Caminho do código fonte
sonar.sources=.

# Diretórios e arquivos a serem excluídos da análise
sonar.exclusions=**/node_modules/**,\
                 **/dist/**,\
                 **/build/**,\
                 **/coverage/**,\
                 **/test/**,\
                 **/tests/**,\
                 **/*.spec.ts,\
                 **/*.spec.js,\
                 **/*.test.ts,\
                 **/*.test.js,\
                 **/vendor/**,\
                 **/ftp/**,\
                 **/frontend/dist/**,\
                 **/frontend/node_modules/**

# Configuração da linguagem principal
sonar.language=js
sonar.sourceEncoding=UTF-8

# Configuração do host SonarQube
sonar.host.url=http://localhost:9000

# Configuração de cobertura de testes (se disponível)
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Configuração de análise TypeScript
sonar.typescript.tsconfigPath=tsconfig.json

# Configuração de análise de segurança
sonar.security.hotspots.enable=true
